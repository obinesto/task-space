name: Resolve Dependabot PR
"on":
  workflow_run:
    workflows:
      - Dependency compatibility
    types:
      - completed
permissions:
  actions: read
  checks: read
  contents: write
  pull-requests: write
  statuses: write
concurrency:
  group: dependabot-merge-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: false
jobs:
  merge:
    if: >-
      (contains(fromJSON('["success","failure","timed_out"]'), github.event.workflow_run.conclusion) &&
      contains(fromJSON('["pull_request","pull_request_review"]'), github.event.workflow_run.event) &&
      startsWith(github.event.workflow_run.head_branch, 'dependabot/')) && github.event.workflow_run.display_title !=
      'Unrelated dependency event'
    name: Resolve validated PR
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: actions/github-script@v9
        env:
          GH_TOKEN: ${{ github.token }}
        with:
          script: |
            const resolver = require('./.github/scripts/resolve-dependabot.cjs');
            await resolver.resolvePullRequest({github, context, core, exec});
