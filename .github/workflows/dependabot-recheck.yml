name: Recheck held Dependabot PRs
"on":
  schedule:
    - cron: 31 6 * * *
  workflow_dispatch: {}
permissions:
  contents: read
  pull-requests: read
  actions: write
  statuses: write
concurrency:
  group: dependabot-recheck
  cancel-in-progress: false
jobs:
  recheck:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: actions/github-script@v9
        with:
          script: |
            const policy = require('./.github/scripts/dependabot-policy.cjs');
            await policy.recheckHeldPullRequests({github, context, core});
